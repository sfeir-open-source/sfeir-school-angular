<section>
  <mat-card class="mat-whiteframe-2dp">
    <mat-card-title-group>
      <img mat-card-image [ngSrc]="_person().photo" height="128" width="128" alt="person-photo" />
      <mat-card-title>
        <a href="/people/1"> <span>{{ _person().firstname }} {{ _person().lastname }}</span> </a>
      </mat-card-title>
      <mat-card-subtitle>{{ _person().entity }}</mat-card-subtitle>
      <mat-card-subtitle class="contact-info">
        <mat-icon>email</mat-icon>
        <a href="mailto:{{ _person().email }}" title="Send an email to {{ _person().firstname }} {{ _person().lastname }}" class="truncate"
          >{{ _person().email }}</a
        >
      </mat-card-subtitle>
      <mat-card-subtitle class="contact-info">
        <mat-icon>phone</mat-icon>
        <a href="tel:{{ _person().phone }}" title="Call {{ _person().firstname }} {{ _person().lastname }}">{{ _person().phone }}</a>
      </mat-card-subtitle>
    </mat-card-title-group>
    <mat-card-content>
      <div class="contact-info">Manager <a href="/people/{{ _person().managerId }}">{{ _person().manager }}</a></div>
      <div class="contact-info">Location<a href="http://www.sfeir.com/contact/">SFEIR</a></div>
      <div class="buttons-info">
        <a mat-button title="Locate" href="/people/{{ _person().id }}">
          <mat-icon>map</mat-icon>
        </a>
        <a mat-button title="Edit" href="/people/{{ _person().id }}">
          <mat-icon>create</mat-icon>
        </a>
        <a mat-button title="Delete" href="#">
          <mat-icon>delete</mat-icon>
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</section>
