<section>
  <!-- Template for displaying the card in card view -->
  <sfeir-card />

  <!-- template for displaying on item on list view -->
  <mat-list>
    <mat-list-item class="mat-whiteframe-2dp mat-card">
      <img alt="person-image" [ngSrc]="person.photo" matListItemAvatar height="40" width="40" />
      <h3 matListItemLine>
        {{ person.firstname }} {{ person.lastname }}
        <span class="sfeir-badge" [sfeirKing]="person.isManager"></span>
      </h3>
      <p matListItemLine>
        <span> {{ person.entity }} </span> — <span>{{ person.email }} </span>
      </p>
    </mat-list-item>
  </mat-list>
</section>

<!-- template for the button -->
<section class="buttons-fab">
  <button mat-fab color="warn" data-testid="view-button">
    <i class="material-icons"> 'list' || 'view_stream'</i>
  </button>
</section>
