<section>
  @switch (view()) {
    @case ('card') {
      @for (person of _people(); track person.id) {
        <sfeir-card [person]="person" (delete)="handleDelete($event)" />
      } @empty {
        <sfeir-loader />
      }
    }

    @case ('list') {
      <mat-list>
        @for (person of _people(); track person.id) {
          <mat-list-item class="mat-whiteframe-2dp mat-card">
            <img alt="person-image" [ngSrc]="person.photo" matListItemAvatar height="40" width="40" />
            <h3 matListItemLine>
              {{ person.firstname }} {{ person.lastname }}
              <span class="sfeir-badge" [sfeirKing]="person.isManager"></span>
            </h3>
            <p matListItemLine>
              <span> {{ person.entity }} </span> — <span>{{ person.email }} </span>
            </p>
          </mat-list-item>
        } @empty {
          <sfeir-loader />
        }
      </mat-list>
    }
  }
</section>

<section class="buttons-fab">
  <button mat-fab color="warn" (click)="handleChangeView()" data-testid="view-button">
    <i class="material-icons">{{ view() === 'card' ? 'view_stream' : 'list' }}</i>
  </button>
</section>
