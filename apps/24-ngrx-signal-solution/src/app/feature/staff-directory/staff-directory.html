<sfeir-loader [isLoading]="_store.isLoading()">
  <section>
    @switch (_store.view()) {
      @case ('card') {
        @for (person of _store.filteredPeople(); track person.id) {
          <sfeir-card [person]="person" (delete)="_store.deletePerson($event)" />
        }
      }

      @case ('list') {
        <sfeir-list [data]="_store.filteredPeople()">
          <ng-template #item let-person>
            <mat-list-item>
              <img alt="person-image" [ngSrc]="person.photo" matListItemAvatar height="40" width="40" />
              <h3 matListItemTitle>
                {{ person.firstname }} {{ person.lastname }}
                <span class="sfeir-badge" [sfeirKing]="person.isManager"></span>
              </h3>
              <p matListItemLine>
                <span> {{ person.entity }} </span> — <span>{{ person.email }} </span>
              </p>
            </mat-list-item>
          </ng-template>
        </sfeir-list>
      }
    }
  </section>
  <section class="buttons-fab">
    <button mat-fab color="accent" class="button-add" data-testid="button-modal" (click)="_store.addPerson()">
      <i class="material-icons">add</i>
    </button>
    <button mat-fab color="warn" data-testid="view-button" (click)="_store.changeView()">
      <i class="material-icons">{{ _store.view() === 'card' ? 'view_stream' : 'list' }}</i>
    </button>
  </section>
</sfeir-loader>
