<mat-form-field appearance="outline">
  <mat-label>{{ placeholder() }}</mat-label>
  <input matInput [type]="type()" [formControl]="_control" [errorStateMatcher]="_errorMatcher()" (blur)="handleBlur()" />
  <mat-error>
    @for (error of errors() | keyvalue; track error.key) {
      {{ _mapErrorMessage[error.key] }}
    }
  </mat-error>
</mat-form-field>
