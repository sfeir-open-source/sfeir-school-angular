<form [formGroup]="_personForm" (ngSubmit)="submit(_personForm.getRawValue())" data-testid="person-form">
  <section class="form-container">
    <section class="form-container__image">
      <img width="100" height="100" [ngSrc]="_personForm.controls.photo.value" alt="person-photo" />
      <input type="hidden" name="photo" formControlName="photo" />
    </section>
    <section class="form-container__form">
      <sfeir-input [errors]="_personForm.controls.firstname.errors" [placeholder]="'First name'" [type]="'text'" formControlName="firstname" />
      <sfeir-input [errors]="_personForm.controls.lastname.errors" [placeholder]="'Last name'" [type]="'text'" formControlName="lastname" />
      <sfeir-input [errors]="_personForm.controls.email.errors" [placeholder]="'Email'" [type]="'email'" formControlName="email" />
      <sfeir-input [errors]="_personForm.controls.phone.errors" [placeholder]="'Phone'" [type]="'tel'" formControlName="phone" />
    </section>
  </section>
  <div class="form-user-action">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-button color="primary" type="submit" [disabled]="!_personForm.valid">Save</button>
  </div>
</form>
