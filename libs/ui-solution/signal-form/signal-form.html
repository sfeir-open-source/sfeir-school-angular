<form [formRoot]="_form">
  <section class="form-container">
    <section class="form-container__image">
      <img width="100" height="100" [ngSrc]="_form.photo().value()" alt="person-photo" />
      <input type="hidden" [formField]="_form.photo" />
    </section>
    <section class="form-container__form">
      <sfeir-input [formField]="_form.firstname" [type]="'text'" [placeholder]="'First Name'" />
      <sfeir-input [formField]="_form.lastname" [type]="'text'" [placeholder]="'Last Name'" />
      <sfeir-input [formField]="_form.email" [type]="'text'" [placeholder]="'Email'" />
      <sfeir-input *sfeirSecret="let type" [formField]="_form.phone" [type]="type" [placeholder]="'Phone'" />
    </section>
  </section>
  <div class="form-user-action">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-button color="primary" type="submit" [disabled]="_form().invalid()">Save</button>
  </div>
</form>
