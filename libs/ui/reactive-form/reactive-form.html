<form>
  <section class="form-container">
    <section class="form-container__image">
      <img width="100" height="100" ngSrc="https://randomuser.me/api/portraits/lego/6.jpg" alt="person-photo" />
      <input type="hidden" />
    </section>
    <section class="form-container__form">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input type="text" matInput placeholder="First name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input type="text" matInput placeholder="Last name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input type="email" matInput placeholder="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>phone</mat-label>
        <input type="phone" matInput placeholder="phone" />
      </mat-form-field>
    </section>
  </section>
  <div class="form-user-action">
    <button mat-button type="button">Cancel</button>
    <button mat-button color="primary" type="submit">Save</button>
  </div>
</form>
